[package]
name = "spacer"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
trash = "5.2"
crossbeam-channel = "0.5"
rayon = "1.10"
chrono = "0.4"
anyhow = "1.0"
walkdir = "2.5"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
semver = "1.0"
self-replace = "1.5"
flate2 = "1.0"
tar = "0.4"
tempfile = "3.17"
